# A real `parallax-proxy` configuration for `deploy/gcp`'s demo stack, pointed
# at the actual GCP `c3-standard-4` instance Task 7 provisioned and measured
# — not a template with a placeholder address. Every value below either names
# that deployment directly or was derived and then checked against what it
# reported; where the two could disagree, that is said, not hidden.
#
# Run from this machine (not the confidential VM). `listen` below is a plain
# TCP socket, not TLS — the proxy speaks RA-TLS to `upstream`, not to its own
# client — so this is `http://`, not `https://`:
#
#   cargo run --features fetch-collateral --bin parallax-proxy -- examples/gcp-c3.toml
#   curl http://localhost:8080/
#
# The instance's external IP, from:
#   gcloud compute instances describe parallax-demo --zone=us-central1-a \
#     --project=example-project --format='value(networkInterfaces[0].accessConfigs[0].natIP)'
#
# THIS ADDRESS NO LONGER RESOLVES TO ANYTHING OF OURS. `parallax-demo` was a
# specific demo instance, torn down after Task 7's capture so it would not be
# left billing. GCP recycles external IPs, so `203.0.113.10` now names
# whatever project it was next handed to, not this deployment. This file is
# kept as the real, measured record of what Task 7 actually ran against —
# reusing it against a live deployment means provisioning a fresh instance
# and replacing this address (and, per the `rtmr3` comment below, certainly
# the reference values too, since a fresh publish produces a fresh digest).
upstream = "https://203.0.113.10:8443"

# Loopback, matching every example in this repository — see
# examples/proxy.toml's comment on why that is not optional: this proxy
# performs no client authentication, so whoever can reach `listen` gets the
# attested upstream's traffic.
listen = "127.0.0.1:8080"

# The permissive policy, not `policy-strict.toml`. `policy-strict.toml` sets
# `forbid_undetectable = true`, which refuses every TDX attestation outright
# (see that file's own test, `the_shipped_example_fails_its_startup_check`) —
# it would never reach the point of comparing a measurement to anything, and
# this file exists to demonstrate exactly that comparison.
policy = "examples/policy-proxy.toml"

[collateral]
# Same public collateral source `examples/proxy.toml` and this repository's
# README use.
source    = "https://api.trustedservices.intel.com/tdx/certification/v4"
cache_ttl = "12h"

[reference_values]
# MRTD — measures firmware, bootloader, kernel and initrd, so it is the same
# for every workload on this platform and cannot by itself distinguish one
# deployed image from another (that is what rtmr3 below is for).
#
# NOT derived offline: MRTD is GCP's firmware measurement, not something this
# deployment chooses, so it has to be read out of a real quote rather than
# computed. Read from `parallax-demo` by `deploy/gcp/up.sh`, which takes a
# quote via configfs-tsm (report_data = 64 zero bytes; taking a quote has no
# once-per-boot hazard, unlike extending RTMR3) and slices the TD report body
# at absolute offset 184 — see docs/spike-rtmr-gcp.md for why 184, not the
# plan's original 136, and why it is body-relative vs. quote-absolute that
# most easily goes wrong. Command, in full, run on the guest:
#
#   tsm=/sys/kernel/config/tsm/report/probe-$$; sudo mkdir "$tsm"
#   sudo dd if=/dev/zero of="$tsm/inblob" bs=64 count=1 status=none
#   sudo cat "$tsm/outblob" > /tmp/quote.bin; sudo rmdir "$tsm"
#   xxd -p -s 184 -l 48 /tmp/quote.bin | tr -d '\n'
#
# Result, byte-identical to every other capture of this platform in this
# repository (`tests/fixtures/gcp-c3-rtmr/`, `tests/fixtures/gcp-c3-tdx/`,
# `tests/fixtures/gcp-c3-bound/`) despite each being a different instance, a
# different day:
mrtd = ["c1ee9c16e3afc506cfe042c5b846a368528f3b37618eafb27469bc114cf914e9222c91618470e7f2b28ac360968270a5"]

# RTMR3 — what `parallax-attest` extends with a measurement of the workload
# it fronts, so unlike mrtd this axis is what tells one deployed image from
# another. Task 7's "deploy a different image, watch the proxy refuse it"
# demonstration is this list not containing the other image's value.
#
# Derived OFFLINE from a registry manifest digest, via the published-image
# flow Tasks 1-6 built (`deploy/gcp/publish.sh`, `deploy/gcp/up.sh`) — NOT
# from a local `docker image inspect -f '{{.Id}}'`, which is exactly the
# unstable quantity this flow replaces (see `deploy/gcp/app/Dockerfile` and
# `tests/fixtures/publish-digest-stability/` for the measured reason why).
# `deploy/gcp/publish.sh` built `deploy/gcp/app` once, pushed it to
# `us-central1-docker.pkg.dev/example-project/parallax-demo/app`, and read back
# its manifest digest:
#
#   sha256:e2c9fbcae48dc0618e7ecb32bdfa2af1f604e0a1578a33cd028cd68b337e9a83
#
# Regenerate this value from that digest alone, offline, any time:
#
#   cargo run --bin parallax -- reference-value \
#     --image-digest sha256:e2c9fbcae48dc0618e7ecb32bdfa2af1f604e0a1578a33cd028cd68b337e9a83
#
# Checked against the running deployment three ways (`deploy/gcp/up.sh`'s own
# output on parallax-demo, after `up.sh` pulled that exact digest and
# extended RTMR3 with it), and all three agreed:
#
#   RTMR3 (derived)      5a53e6faf0d7c66fa02f520832d08aa88db92ae286ceebdffcf05fa935c2f97d55dd7551d78a8c2a2dccd15ccf296ec1
#   RTMR3 (sysfs)        5a53e6faf0d7c66fa02f520832d08aa88db92ae286ceebdffcf05fa935c2f97d55dd7551d78a8c2a2dccd15ccf296ec1
#   RTMR3 (in the quote) 5a53e6faf0d7c66fa02f520832d08aa88db92ae286ceebdffcf05fa935c2f97d55dd7551d78a8c2a2dccd15ccf296ec1
#
# No mismatch to report on THIS value — the offline prediction and the
# hardware agreed. (A different, transient mismatch did occur later in the
# same session, on a *second* boot deploying a *different* image: `up.sh`'s
# own post-extension sysfs re-read raced the just-completed extension and
# briefly read back 48 zero bytes while the quote taken moments earlier
# already showed the correct, extended value; re-reading the same sysfs path
# by hand ~10 seconds later returned the correct, quote-matching value.
# `up.sh`'s consistency check now retries the sysfs read for exactly this
# reason (see its own comment there) rather than trusting a single read; it
# was a timing anomaly in that check, not a defect in this value or in RTMR3
# itself, and does not concern the digit above — the proxy's refusal of that
# second boot's genuinely different RTMR3 is exactly the property this
# reference value exists to make possible; see `docs/WALKTHROUGH.md`.)
#
# THIS DOES NOT SURVIVE A REBUILD from source — it is pinned to the specific
# registry manifest digest quoted above, not to "whatever `deploy/gcp/app`'s
# source currently builds to." That is now true by design, not despite it:
# `deploy/gcp/publish.sh` derives this value from a digest read back from the
# registry after a single build-and-push, and `deploy/gcp/up.sh` refuses to
# deploy anything that is not pinned to a manifest digest, so a rebuild
# produces a *new* digest and a *new* reference value rather than silently
# invalidating this one.
rtmr3 = ["5a53e6faf0d7c66fa02f520832d08aa88db92ae286ceebdffcf05fa935c2f97d55dd7551d78a8c2a2dccd15ccf296ec1"]

# Left at the documented default (warn, not refuse, on an empty list) rather
# than set to `true`: both lists above are populated for this deployment, so
# the flag has no effect on it either way, and there is no `require_rtmr3`
# mirror of this flag yet — deliberately deferred, see
# `docs/WALKTHROUGH.md`'s "Does not cover" section — for it to pair with.
require = false
