upstream = "https://svc.internal:8443"

# Plaintext and unauthenticated. This proxy terminates a bare TCP connection
# here and forwards bytes; it does not check who the client is, and there is no
# key or certificate for it to present. Everything the proxy proves is about the
# *upstream* hop. That is why every example in this repository binds loopback:
# on any other interface, whoever can reach this port gets the attested
# upstream's traffic, and the attestation says nothing about them.
listen   = "127.0.0.1:8080"

policy   = "examples/policy-strict.toml"

[collateral]
source    = "https://api.trustedservices.intel.com/tdx/certification/v4"

# How stale a served collateral bundle may be, and the detection latency the
# manifest reports for `urn:parallax:collateral-cache`.
#
# It is also the operator's declared refresh interval, handed to `verify_quote`
# — and against real Intel collateral that half has no effect on the derived
# set. `derive::pcs_detection_bound` takes the *worse* of this and the width of
# the window Intel issued the bundle for, and `Latency`'s join is `max`: Intel's
# TCB info runs about 30 days, so 12h is absorbed and
# `accurate_collateral_issuance` is reported at the 30-day figure regardless of
# what is written here. Believing the promise is what `pcs_detection_bound`
# declines to do. The cache's own entry does move with this value.
#
# `"never"` is refused rather than parsed: it disables the cache (so the real
# staleness is near zero) while reporting the collateral authority as never
# detectable. See `ConfigError::NeverIsNotABound`.
cache_ttl = "12h"

[reference_values]
# Absent on purpose: with no reference values the proxy allows but warns that
# this attests some code ran in a genuine trust domain, not that it is yours.
mrtd = []

# RTMR3, the register `parallax-attest` extends with a workload's own
# measurement (see `ratls::expected_rtmr3`), is a second, independent axis from
# `mrtd` above. MRTD names the platform firmware, which is the same across
# every workload that runs on it; RTMR3 is what tells one deployed image from
# another. Absent here for the same reason `mrtd` is: with nothing configured
# the proxy allows but records that the workload's identity, specifically, was
# never compared to anything.
#
# To compute a value for a real deployment: take the workload's own digest
# `d` (a container image's SHA-256, or whatever `parallax-attest`'s config
# names) and write
# `hex(ratls::expected_rtmr3(&ratls::workload_measurement(d)))` — the same
# arithmetic the sidecar itself performs starting from a freshly booted VM,
# where RTMR3 is 48 zero bytes. Not invented here: this repository's only
# worked example of that arithmetic is
# `tests/fixtures/gcp-c3-rtmr/quote-after.bin`, a real GCP capture after
# extending `d = "parallax-attest-spike-v1"`. Its reported RTMR3,
# `73f94f274f5bcfccde03b398fbfd063f2687a0568b0ef760c4db4c4f35a29eae8c6a27a10f6ebc73f61c29afaf5c90c3`,
# is exactly `ratls::expected_rtmr3(&ratls::workload_measurement(d))` for that
# `d` — pinned by `the_rtmr3_config_path_agrees_with_the_attesters_arithmetic`
# in `src/derive.rs` — but it measures a spike's test string, not
# `svc.internal`'s actual image, so it is left commented out here rather than
# shipped as a value an operator might mistake for their own deployment's.
#
# rtmr3 = ["73f94f274f5bcfccde03b398fbfd063f2687a0568b0ef760c4db4c4f35a29eae8c6a27a10f6ebc73f61c29afaf5c90c3"]
rtmr3 = []

# This configuration exits 1 at startup, and that is the demonstration.
#
# `examples/policy-strict.toml` sets `forbid_undetectable = true`. No TDX
# attestation can satisfy that: the residual trust set always contains
# `did:web:intel.com` for `silicon_and_microcode_integrity`, and nothing detects
# a compromise of Intel's root — there is no monitoring that would notice. The
# proxy runs `gate::startup_check` before it binds a listener, discovers that
# even the most favourable outcome this configuration could ever produce is
# refused, and says so instead of answering 502 to every connection for the
# rest of its life. `the_shipped_example_fails_its_startup_check` in
# `src/proxy/config.rs` pins it.
#
# For a policy that does admit an attestation, point `policy` at
# `examples/policy-proxy.toml` and read the comments there for what it gives up.
#
# Other keys this file does not set, with their defaults:
#
#   quote_oid       = "1.2.840.113741.1337.6"   # Gramine's and Intel's
#   root_ca_pem     = <unset>                   # Intel's production root
#   max_connections = 512                       # connections in flight
#   [reference_values].require = false          # warn rather than refuse
#
# `max_connections` is not a throughput knob. Every connection, including one
# that will be refused, costs a full TLS handshake against the upstream before
# the gate can run — the evidence arrives in that handshake and there is nowhere
# earlier to get it — so an unauthenticated client has 1:1 handshake
# amplification onto the service this proxy protects. Clients beyond the cap
# wait in the listen backlog rather than receiving a 502 they might read as a
# verdict about the upstream.
#
# Setting `require = true` turns the warning above into a refusal. It is the
# same gate as putting `urn:reference-values:unconfigured` on the policy's
# forbidden list — see
# `requiring_reference_values_is_the_same_gate_as_forbidding_the_principal`.
