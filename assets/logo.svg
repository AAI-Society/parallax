<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="parallax">
  <title>parallax</title>
  <desc>Two sight lines from a baseline converging on a single point — the parallax angle, which is how you measure a distance you cannot walk to.</desc>

  <rect width="256" height="256" rx="52" fill="#0A0A0A"/>

  <!-- the baseline: two vantage points you observe from -->
  <line x1="62" y1="186" x2="194" y2="186" stroke="#CFFF04" stroke-width="6" stroke-linecap="round" opacity="0.32"/>

  <!-- the two sight lines, converging -->
  <path d="M62 186 L128 78" stroke="#CFFF04" stroke-width="7" stroke-linecap="round"/>
  <path d="M194 186 L128 78" stroke="#CFFF04" stroke-width="7" stroke-linecap="round"/>

  <!-- the vantage points -->
  <circle cx="62" cy="186" r="13" fill="#CFFF04"/>
  <circle cx="194" cy="186" r="13" fill="#CFFF04"/>

  <!-- the object: what both lines resolve to -->
  <circle cx="128" cy="78" r="20" fill="#0A0A0A" stroke="#CFFF04" stroke-width="7"/>
</svg>
