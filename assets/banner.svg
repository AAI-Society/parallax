<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="parallax — which parties must you still trust, and for how long would you not know?">
  <title>parallax</title>

  <rect width="1200" height="320" fill="#0A0A0A"/>
  <rect y="313" width="1200" height="7" fill="#CFFF04"/>

  <!-- mark -->
  <g transform="translate(96, 88) scale(0.56)">
    <line x1="62" y1="186" x2="194" y2="186" stroke="#CFFF04" stroke-width="8" stroke-linecap="round" opacity="0.32"/>
    <path d="M62 186 L128 78" stroke="#CFFF04" stroke-width="10" stroke-linecap="round"/>
    <path d="M194 186 L128 78" stroke="#CFFF04" stroke-width="10" stroke-linecap="round"/>
    <circle cx="62" cy="186" r="16" fill="#CFFF04"/>
    <circle cx="194" cy="186" r="16" fill="#CFFF04"/>
    <circle cx="128" cy="78" r="24" fill="#0A0A0A" stroke="#CFFF04" stroke-width="10"/>
  </g>

  <!-- wordmark -->
  <text x="272" y="158"
        font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="82" font-weight="700" fill="#F0EDEA" letter-spacing="-1">parallax</text>

  <text x="274" y="206"
        font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif"
        font-size="26" fill="#8F8A82">Which parties must you still trust, and for how long would you not know?</text>

  <g transform="translate(274, 236)">
    <rect width="30" height="4" rx="2" fill="#CFFF04"/>
    <text x="46" y="8"
          font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif"
          font-size="19" font-weight="600" fill="#CFFF04" letter-spacing="1.4">ADVANCED AI SOCIETY</text>
    <text x="306" y="8"
          font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif"
          font-size="19" fill="#8F8A82">· PROOF-OF-CONTROL INITIATIVE</text>
  </g>
</svg>
