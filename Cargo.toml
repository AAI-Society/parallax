[package]
name = "parallax"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
license = "Apache-2.0"
description = "Compute the residual trust set of an attestation deployment"
repository = "https://github.com/Task-force-for-AI-agents-in-Healthcare/parallax"

[lib]
name = "parallax"
path = "src/lib.rs"

[[bin]]
name = "parallax"
path = "src/bin/parallax.rs"

# A one-off tool, not part of the shipped CLI: it is how the test fixture in
# `tests/fixtures/` was produced, and it is committed so that the fixture can
# be reproduced rather than merely trusted. Behind a feature because it is the
# only thing here that talks to the network — see `[features]` below.
#
#   cargo run --features fetch-collateral --bin fetch-collateral -- <dir>
[[bin]]
name = "fetch-collateral"
path = "src/bin/fetch-collateral.rs"
required-features = ["fetch-collateral"]

# The proxy. Behind `fetch-collateral` because it cannot work without
# `CollateralSource::fetch`: appraising a quote needs collateral for the
# platform that produced it, and a proxy does not know in advance which
# platforms it will meet. The *gate* — `src/proxy/gate.rs`, where the decision
# is made — is in the default build and tested there, so the offline build still
# links no HTTP client and no TLS stack.
#
#   cargo run --features fetch-collateral --bin parallax-proxy -- examples/proxy.toml
[[bin]]
name = "parallax-proxy"
path = "src/bin/parallax-proxy.rs"
required-features = ["fetch-collateral"]

# The only test that talks to Intel. Declared explicitly so it can carry
# `required-features`: without that, a default `cargo test` would try to build a
# file that calls the feature-gated `CollateralSource::fetch` and fail to
# compile. With it, the target is not built at all unless the feature is on, and
# `#[ignore]` then keeps it from running even when it is. See
# `tests/live_pcs.rs` for what a failure means.
#
#   cargo test --features fetch-collateral --test live_pcs -- --ignored
[[test]]
name = "live_pcs"
path = "tests/live_pcs.rs"
required-features = ["fetch-collateral"]

# The proxy over real sockets. Needs the same feature the binary does, and for
# the same reason. It talks to nothing outside the process: the collateral
# source is primed with the committed bundle, so `fetch` is served from the
# cache and no packet leaves the machine.
#
#   cargo test --features fetch-collateral --test proxy
[[test]]
name = "proxy"
path = "tests/proxy.rs"
required-features = ["fetch-collateral"]

[features]
default = []
# Pulls in dcap-qvl's `report` feature (its async PCCS client), an async
# runtime to drive it, and the TLS client the proxy speaks RA-TLS with. Off by
# default, and that default is the point: parallax verifies attestations
# *offline*, against collateral frozen on disk, and a tool making that argument
# should not ship a HTTP client and a TLS stack it never calls. Enabling it
# takes the normal dependency graph from 194 crates to 287, reqwest, rustls and
# tokio-rustls among them; `Cargo.lock` lists all 363 either way, because a
# lockfile is not feature-conditional. Every number here is one command, so
# check them rather than trusting this comment:
#
#   cargo tree -e normal --prefix none | sed 's/ (.*//' | sort -u | wc -l
#   cargo tree -e normal --prefix none --features fetch-collateral | ... | wc -l
#   cargo tree -i reqwest -e normal        # no match without the feature
#   cargo tree -i rustls  -e normal        # nor this one
#
# `rustls` and `tokio-rustls` ride on this feature rather than on one of their
# own. They could have had a separate `proxy` feature, and the reason they do
# not is that the proxy needs `CollateralSource::fetch`, so any build that has
# the proxy already has reqwest and rustls; a second feature would name a
# configuration nobody can use. `Cargo.lock` is not feature-conditional and
# lists everything either way.
fetch-collateral = [
    "dep:tokio",
    "dcap-qvl/report",
    "dep:rustls",
    "dep:tokio-rustls",
    "tokio/net",
    "tokio/io-util",
    "tokio/signal",
    "tokio/time",
    "tokio/sync",
]

[dependencies]
ascent = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
clap = { version = "4", features = ["derive"] }
thiserror = "2"
anyhow = "1"
humantime = "2"

# PEM decoding for `RootCa::Custom`, whose payload is a certificate an
# operator pasted in. Already in the tree as a non-optional dependency of
# dcap-qvl, so naming it here adds no package to the lockfile; it is named
# rather than reached through dcap-qvl because dcap-qvl does not re-export it.
pem = "3"
# Used for exactly one check: that a custom root CA is self-issued. That is a
# precondition of the CRL check inside dcap-qvl's webpki fork, which asserts on
# it rather than returning an error — see `require_self_issued` in
# `src/verify/chain.rs`. Version and `default-features = false` match what
# dcap-qvl already resolves, so this adds no package to the lockfile.
x509-cert = { version = "0.3", default-features = false }
# One use: telling the caller how much of their buffer was actually attested.
# The quote is SCALE-encoded, and `Quote::decode` on a `&mut &[u8]` is the only
# way to learn how many bytes it consumed. Version, package rename and
# `default-features = false` match what dcap-qvl already resolves, so this adds
# no package to the lockfile.
scale = { package = "parity-scale-codec", version = "3.7.5", default-features = false }
# The digest an RA-TLS `report_data` commits to: `SHA-256(subjectPublicKeyInfo)`
# — see `src/verify/binding.rs`. Version matches what dcap-qvl already
# resolves, so this adds no package to the lockfile.
sha2 = { version = "0.11", default-features = false }

# The DCAP quote verifier. `default-features = false` plus these four
# reproduces the crate's default set *minus* `report`, which is what drags in
# reqwest, rustls, hickory-dns and an async runtime. `default-x509` is the one
# that gates `verify::verify`, the entry point everything offline uses;
# `ring` and `rustcrypto` are its crypto backends.
dcap-qvl = { version = "0.6", default-features = false, features = [
    "std",
    "ring",
    "rustcrypto",
    "default-x509",
] }
# Only `fetch-collateral` needs an async runtime: `CollateralClient::fetch` is
# the crate's sole async surface. `rt-multi-thread` rather than `rt` because
# reqwest's connection pool expects to be driven by more than one worker.
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
], optional = true }

# The proxy's TLS client. An RA-TLS peer presents a self-signed, ephemeral
# certificate that no public CA has seen, so `src/proxy/serve.rs` installs a
# custom `ServerCertVerifier`: the chain check is replaced by the attestation,
# while the handshake signature check is delegated to rustls' own
# implementation, because that is what proves the peer holds the key the quote
# commits to.
#
# `aws-lc-rs` rather than `ring`, which is the opposite of the choice made for
# rcgen below: under this feature reqwest already resolves rustls with
# aws-lc-rs, so matching it adds no package and no second crypto backend. Both
# are already built in any build that can run the proxy.
rustls = { version = "0.23", default-features = false, features = [
    "std",
    "tls12",
    "aws-lc-rs",
], optional = true }
tokio-rustls = { version = "0.26", default-features = false, features = [
    "tls12",
    "aws-lc-rs",
], optional = true }

# Used only to restore the default SIGPIPE disposition in `src/bin/parallax.rs`
# before any output is written (see `reset_sigpipe`). Unix-only: Windows has
# no SIGPIPE, and `println!` there doesn't panic on a closed pipe the same way.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
# Certificates for the RA-TLS tests in `src/verify/binding.rs` and
# `src/verify/quote.rs`. The committed fixture's `report_data` is 64 zero bytes
# (a capture-time placeholder — see `tests/fixtures/gcp-c3-tdx/PROVENANCE.md`),
# so the real quote can only demonstrate a *rejected* binding; a successful one
# needs a certificate whose key we chose, generated here.
#
# `ring` rather than the default `aws_lc_rs` backend: dcap-qvl already resolves
# ring, so this adds no C toolchain and no cmake build to `cargo test`.
rcgen = { version = "0.13", default-features = false, features = ["crypto", "ring"] }
