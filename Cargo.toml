[package]
name = "parallax"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
license = "Apache-2.0"
description = "Compute the residual trust set of an attestation deployment"
repository = "https://github.com/Task-force-for-AI-agents-in-Healthcare/parallax"

[lib]
name = "parallax"
path = "src/lib.rs"

[[bin]]
name = "parallax"
path = "src/bin/parallax.rs"

# A one-off tool, not part of the shipped CLI: it is how the test fixture in
# `tests/fixtures/` was produced, and it is committed so that the fixture can
# be reproduced rather than merely trusted. Behind a feature because it is the
# only thing here that talks to the network — see `[features]` below.
#
#   cargo run --features fetch-collateral --bin fetch-collateral -- <dir>
[[bin]]
name = "fetch-collateral"
path = "src/bin/fetch-collateral.rs"
required-features = ["fetch-collateral"]

[features]
default = []
# Pulls in dcap-qvl's `report` feature (its async PCCS client) and an async
# runtime to drive it. Off by default, and that default is the point: parallax
# verifies attestations *offline*, against collateral frozen on disk, and a
# tool making that argument should not ship a HTTP client and a TLS stack it
# never calls. Enabling this took Cargo.lock from 78 packages to 354.
fetch-collateral = ["dep:tokio", "dcap-qvl/report"]

[dependencies]
ascent = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
clap = { version = "4", features = ["derive"] }
thiserror = "2"
anyhow = "1"
humantime = "2"

# PEM decoding for `RootCa::Custom`, whose payload is a certificate an
# operator pasted in. Already in the tree as a non-optional dependency of
# dcap-qvl, so naming it here adds no package to the lockfile; it is named
# rather than reached through dcap-qvl because dcap-qvl does not re-export it.
pem = "3"
# Used for exactly one check: that a custom root CA is self-issued. That is a
# precondition of the CRL check inside dcap-qvl's webpki fork, which asserts on
# it rather than returning an error — see `require_self_issued` in
# `src/verify/chain.rs`. Version and `default-features = false` match what
# dcap-qvl already resolves, so this adds no package to the lockfile.
x509-cert = { version = "0.3", default-features = false }
# One use: telling the caller how much of their buffer was actually attested.
# The quote is SCALE-encoded, and `Quote::decode` on a `&mut &[u8]` is the only
# way to learn how many bytes it consumed. Version, package rename and
# `default-features = false` match what dcap-qvl already resolves, so this adds
# no package to the lockfile.
scale = { package = "parity-scale-codec", version = "3.7.5", default-features = false }
# The digest an RA-TLS `report_data` commits to: `SHA-256(subjectPublicKeyInfo)`
# — see `src/verify/binding.rs`. Version matches what dcap-qvl already
# resolves, so this adds no package to the lockfile.
sha2 = { version = "0.11", default-features = false }

# The DCAP quote verifier. `default-features = false` plus these four
# reproduces the crate's default set *minus* `report`, which is what drags in
# reqwest, rustls, hickory-dns and an async runtime. `default-x509` is the one
# that gates `verify::verify`, the entry point everything offline uses;
# `ring` and `rustcrypto` are its crypto backends.
dcap-qvl = { version = "0.6", default-features = false, features = [
    "std",
    "ring",
    "rustcrypto",
    "default-x509",
] }
# Only `fetch-collateral` needs an async runtime: `CollateralClient::fetch` is
# the crate's sole async surface. `rt-multi-thread` rather than `rt` because
# reqwest's connection pool expects to be driven by more than one worker.
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
], optional = true }

# Used only to restore the default SIGPIPE disposition in `src/bin/parallax.rs`
# before any output is written (see `reset_sigpipe`). Unix-only: Windows has
# no SIGPIPE, and `println!` there doesn't panic on a closed pipe the same way.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
# Certificates for the RA-TLS tests in `src/verify/binding.rs` and
# `src/verify/quote.rs`. The committed fixture's `report_data` is 64 zero bytes
# (a capture-time placeholder — see `tests/fixtures/gcp-c3-tdx/PROVENANCE.md`),
# so the real quote can only demonstrate a *rejected* binding; a successful one
# needs a certificate whose key we chose, generated here.
#
# `ring` rather than the default `aws_lc_rs` backend: dcap-qvl already resolves
# ring, so this adds no C toolchain and no cmake build to `cargo test`.
rcgen = { version = "0.13", default-features = false, features = ["crypto", "ring"] }
