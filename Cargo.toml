[package]
name = "parallax"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
license = "Apache-2.0"
description = "Compute the residual trust set of an attestation deployment"
repository = "https://github.com/Task-force-for-AI-agents-in-Healthcare/parallax"

[lib]
name = "parallax"
path = "src/lib.rs"

[[bin]]
name = "parallax"
path = "src/bin/parallax.rs"

[dependencies]
ascent = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
clap = { version = "4", features = ["derive"] }
thiserror = "2"
anyhow = "1"
humantime = "2"
