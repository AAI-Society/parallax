name: ci
on: [push, pull_request]
jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all-targets
      # The default build is the one that must stay dependency-light — no HTTP
      # client, no TLS stack — so it is checked first and on its own. But until
      # this job existed, *nothing in CI ever built `fetch-collateral`*: the
      # collateral fetch and cache, the whole `proxy::serve` module and its 14
      # socket tests were compiled only on a developer's machine. The README
      # badge cited a test count CI could not reproduce.
      #
      # `live_pcs` stays `#[ignore]`d here and is not un-ignored: it talks to
      # Intel, and a merge must not depend on somebody else's uptime.
      - run: cargo clippy --all-targets --features fetch-collateral -- -D warnings
      - run: cargo test --features fetch-collateral
      # The default build must link no HTTP client. `fetch-collateral` is
      # additive and optional precisely so that `parallax solve` stays offline,
      # and a transitive dependency that pulled `reqwest` into the default
      # feature set would undo that silently. `cargo tree -i` exits non-zero
      # when nothing matches, which is the passing case here.
      - name: the default build links no HTTP client
        run: |
          if cargo tree -i reqwest -e normal >/dev/null 2>&1; then
            echo "::error::reqwest is in the default dependency graph"
            cargo tree -i reqwest -e normal
            exit 1
          fi
          echo "no reqwest in the default build"
      - name: results are current
        # `git add -A` before diffing, and diff the *index*, because a plain
        # `git diff results/` is blind to untracked files: adding a sixth
        # example whose manifest was never committed left CI green while
        # `results/` was missing a file the paper would go on to cite.
        # Staging first makes an untracked addition, a deletion, and a
        # modification all show up the same way.
        run: |
          ./scripts/regen-results.sh
          git add -A results/
          git diff --cached --exit-code results/ || {
            echo "results/ is stale — run ./scripts/regen-results.sh and commit"
            exit 1
          }

  # Separate from `rust` on purpose: the paper build needs no toolchain and
  # the Rust job needs no LaTeX, so running them independently keeps either
  # failure legible and lets them run in parallel. The paper reads six
  # generated files out of the committed tree — the trust-set, comparison,
  # summary, policy and ordering tables, plus the shared-dependency listing;
  # `paper/README.md` maps each to the table it becomes. This job only checks
  # that they typeset. It is the `rust` job that proves they are current, so
  # a green `paper` job on its own says nothing about whether the numbers
  # match the code.
  paper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: WtfJoke/setup-tectonic@v3
      - run: cd paper && tectonic -Z shell-escape main.tex
      - name: no placeholders survive with drafts off
        # `paper/README.md` names `grep -c '\placeholder' main.tex` as a
        # pre-submission step. A checklist item is not a gate, so this makes
        # it mechanical.
        #
        # It is deliberately *not* an unconditional "zero placeholders":
        # the paper is a working draft and its results sections are
        # openly placeholdered, so failing on any hit would red-line every
        # build until submission and train everyone to ignore the job. The
        # state that is actually dangerous is `\draftfalse` with
        # placeholders still present: with drafts off a surviving
        # placeholder does not warn, it silently vanishes and leaves the
        # surrounding prose reading as a finished claim. That is what this
        # fails on. The count is always printed, so the number is visible
        # in the log on every run.
        run: |
          cd paper
          count=$(grep -c '\\placeholder{' main.tex || true)
          echo "surviving \\placeholder uses: $count"
          if grep -qE '^[^%]*\\draftfalse' main.tex; then
            if [ "$count" -ne 0 ]; then
              echo "::error::\\draftfalse is set but $count \\placeholder use(s) remain."
              echo "With drafts off they vanish from the PDF instead of warning,"
              echo "leaving the surrounding prose reading as a finished claim."
              exit 1
            fi
            echo "drafts are off and no placeholders remain"
          else
            echo "still a draft (\\drafttrue): placeholders render visibly, not failing"
          fi
